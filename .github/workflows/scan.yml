name: osv-scanner-injection-poc
on: [push]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install osv-scanner
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
        env:
          GOBIN: /usr/local/bin

      - name: Run osv-scanner with license check (default table output)
        run: |
          echo "=== Running osv-scanner with --licenses flag ==="
          echo "=== This triggers license violations table ==="
          osv-scanner scan source --licenses=MIT,Apache-2.0 -L package-lock.json || true

      - name: Canary - this annotation should be SUPPRESSED if injection works
        run: |
          echo "::warning::CANARY - If you can see this warning annotation, injection did NOT work"
