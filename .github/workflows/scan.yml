name: osv-scanner-injection-poc
on: [push]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: CR splitting test - direct printf
        run: |
          echo "=== CR splitting test ==="
          printf 'some text before\r::warning::INJECTED_VIA_CR - this warning was injected via carriage return splitting\r::error::INJECTED_ERROR_VIA_CR\n'
          echo "=== end of test ==="

      - name: Canary annotation
        run: |
          echo "::warning::CANARY - visible means injection did not suppress commands"
